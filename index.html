<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>点字六点入力表示</title>
    <meta
      name="description"
      content="FDSJKLで入力した点字を、かなや数字としてそのまま表示するWebアプリ"
    />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <p class="eyebrow">Braille six-dot input</p>
        <h1>点字六点入力表示</h1>
        <p class="lede">
          キーボードの F・D・S・J・K・L で入力した結果を、そのまま文字として表示します。
        </p>
      </section>

      <section class="panel">
        <div class="status-row">
          <span class="status-label">入力</span>
          <strong id="compositionText">待機中</strong>
        </div>

        <div class="result" aria-label="入力結果">
          <div class="result-label">出力</div>
          <div id="outputText" class="output-text"><span id="outputChars" class="output-chars"></span><span id="cursor" class="cursor" aria-hidden="true"></span></div>
        </div>

        <div class="log" aria-label="入力ログ">
          <div class="log-label">履歴</div>
          <div id="historyText" class="history-text">まだ入力がありません</div>
        </div>

        <button id="clearButton" class="clear-button" type="button">入力をクリア</button>

        <p class="hint">
          操作はキーボードのみです。1文字分の点を同時に押して離すと、対応するかなや数字が出ます。Backspaceでも1文字消せます。出力欄の縦棒がカーソルで、点を押している間は色が変わって点滅が止まります。
        </p>
      </section>
    </main>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
